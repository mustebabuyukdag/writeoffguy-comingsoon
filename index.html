<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Write Off Guy — Coming Soon</title>
  <meta name="description" content="Coming soon." />
  <meta name="robots" content="index, follow" />
  <meta property="og:title" content="Write Off Guy" />
  <meta property="og:description" content="Coming soon." />
  <meta property="og:url" content="https://writeoffguy.com" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --black: #080808;
      --white: #F4EFE6;
      --muted: rgba(244,239,230,0.4);
      --mono:  'IBM Plex Mono', monospace;
      --display: 'Bebas Neue', sans-serif;
    }

    body {
      background: var(--black);
      color: var(--white);
      font-family: var(--mono);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .coming-soon {
      font-family: var(--display);
      font-size: clamp(48px, 8vw, 96px);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--white);
      display: flex;
      align-items: center;
      gap: 20px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.1s forwards;
    }

    .dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #BFFF00;
      flex-shrink: 0;
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    .subtitle {
      font-size: clamp(13px, 1.6vw, 18px);
      font-weight: 300;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-top: 16px;
      opacity: 0;
      animation: fadeUp 0.7s ease 0.35s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-delay: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <h1 class="coming-soon"><span class="dot"></span>Coming Soon</h1>
  <p class="subtitle">Something is coming.</p>
</body>
</html>
